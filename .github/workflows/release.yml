name: release

# Publishes to npm on a version tag.
#
# npm publishing is currently on hold for this package. The publish step checks
# for the token itself and exits green when it is absent, so a tag push is still
# a useful release marker. Add the NPM_TOKEN secret to switch publishing on.
#
# Deliberately conservative: no `secrets` reference in any `if`. GitHub rejects
# such workflows before creating a job, which surfaces only as a 0-second run
# with zero jobs ("This run likely failed because of a workflow file issue").

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No build step: lib/ is plain CommonJS, shipped as authored.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Verify the package contents
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; npm publishing is on hold."
            echo "See docs/PUBLISH.md to switch it on."
            exit 0
          fi

          if npm view "dsh-codex-ui@$version" version >/dev/null 2>&1; then
            echo "dsh-codex-ui@$version is already on npm; nothing to do."
            exit 0
          fi

          npm publish --access public --provenance
