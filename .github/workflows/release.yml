name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No build step: lib/ is plain CommonJS, shipped as authored.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Verify the package contents
        run: npm pack --dry-run

      # A tag can be pushed after the version was already published by hand.
      # That is not a failure, so skip instead of going red.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          if npm view "dsh-codex-ui@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.npm.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Already published
        if: steps.npm.outputs.published == 'true'
        run: echo "dsh-codex-ui@$(node -p "require('./package.json').version") is already on npm; nothing to do."
